# ============================================================================
# BlenderGenDataSet 示例配置文件 (config_sample.yaml)
# ============================================================================
# 本文件是一个完整的配置示例，展示了所有可用参数及其推荐值
# 适用于本地开发和测试，使用相对路径便于快速上手
# ============================================================================

# ----------------------------------------------------------------------------
# 全局配置
# ----------------------------------------------------------------------------
CC_TEXTURES_DIR: './cctextures'          # CC0材质库目录（相对路径，用于箱子纹理随机化）
OUTPUT_DIR: './output'                    # 输出数据集保存目录（相对路径）
ENABLE_DEPTH: true                        # 是否启用深度图输出（true=生成深度数据）
DEPTH_SCALE: 0.1                          # 深度值缩放因子
                                          # BOP标准：将米转换为毫米需设为 0.001
                                          # 当前值 0.1 表示 1m = 100mm（可根据相机标定调整）
NUM_SCENES: 1                             # 要生成的场景总数（建议从少量开始测试）
NUM_CAMERAS_PER_SCENE: 2                  # 每个场景中渲染的相机视角数量

# ----------------------------------------------------------------------------
# 物体配置 (OBJECT)
# ----------------------------------------------------------------------------
OBJECT:
    FILE: "./3DModelDataSets/fall/models/obj_000001.ply"  # 3D模型文件路径（支持 .ply, .obj, .stl）
    
    # 单位设置：'m'(米) / 'mm'(毫米) / 'auto'(自动检测)
    # auto模式：包围盒对角线 <2m 视为米，否则视为毫米
    UNIT: 'auto'
    
    DECIMATION: 5000                      # 面片简化目标数量（-1=不简化）
                                          # 降低面数可加速渲染，但会损失细节
                                          # 推荐值：5000-15000（根据模型复杂度调整）
    
    MOVE_TO_MASS_CENTER: true             # 将物体原点移动到质心
                                          # 强烈建议开启，确保物理模拟准确性

    KEYPOINTS:
        LOCAL_COORDS:                 # 局部坐标系下的关键点坐标，用来生产coco关键点标注
            - [0.00, 0.00, 0.00]      # 例：物体几何中心
            - [0.05, 0.00, 0.00]      # 右侧点
            - [-0.05, 0.00, 0.00]     # 左侧点
        NAMES: ["center", "right", "left"]  #关键点名称
        SKELETON: [[0,1], [0,2]]            #哪些关键点应该用线条连接起来

    # 着色模式：'auto'(自动) / 'smooth'(平滑) / 'flat'(平面)
    SHADING_MODE: 'auto'
    
    # ------------------------------------------------------------------------
    # 物体姿态采样器配置 (POSE_SAMPLER)
    # ------------------------------------------------------------------------
    POSE_SAMPLER:
        MIN_NUM: 30                        # 每个场景中最少物体数量
        MAX_NUM: 40                       # 每个场景中最多物体数量
        
        # 物体初始下落高度范围（相对于世界坐标系原点）
        # 代码会自动调整为高出箱顶至少10cm，防止穿透
        MIN_HEIGHT: 0.3                   # 最小下落高度（米）
                                          # 已优化：从1m降至0.3m（箱高0.15m的2倍）
        MAX_HEIGHT: 0.5                   # 最大下落高度（米）
                                          # 已优化：从1.5m降至0.5m，减少穿透风险
        
        # --------------------------------------------------------------------
        # 物理模拟配置 (PHYSICS) - 关键防穿透参数
        # --------------------------------------------------------------------
        PHYSICS:
            ENABLE: true                  # 启用物理模拟（让物体自然堆叠下落）
            
            MIN_SIMULATION_TIME: 2        # 最小模拟时长（秒）
                                          # 已优化：从1s增至2s，确保物体稳定
            
            MAX_SIMULATION_TIME: 4        # 最大模拟时长（秒）
                                          # 已优化：从2s增至4s，避免过早终止
            
            SUBSTEPS_PER_FRAME: 10        # 每帧的子步数（提高碰撞检测精度）
                                          # 已优化：从5增至10，减少穿模
                                          # 若仍有穿透，可增至15-20
            
            SOLVER_ITERS: 10              # 求解器迭代次数（提高稳定性）
                                          # 已优化：从5增至10，改善收敛性
                                          # 若仍有穿透，可增至15-20
    
    # ------------------------------------------------------------------------
    # 物体材质随机化配置 (MATERIAL_SAMPLER)
    # ------------------------------------------------------------------------
    MATERIAL_SAMPLER:
        MIN_GRAY: 0.5                     # 灰度值下限（0=黑色，1=白色）
        MAX_GRAY: 1.0                     # 灰度值上限（全范围随机）
        
        MIN_ROUGHNESS: 0.2                  # 粗糙度下限（0=镜面反射，1=完全漫反射）
        MAX_ROUGHNESS: 0.9                # 粗糙度上限（中等粗糙度）
        
        MIN_SPECULAR: 0.3                 # 高光强度下限（0=无高光，1=强高光）
        MAX_SPECULAR: 1.0                 # 高光强度上限
        
        MIN_METALLIC: 0.5                   # 金属度下限（0=非金属，1=纯金属）
        MAX_METALLIC: 1.0                 # 金属度上限（全范围随机）

# ----------------------------------------------------------------------------
# 容器配置 (TOTE) - 工业分拣箱
# ----------------------------------------------------------------------------
TOTE:
    # 箱子尺寸（单位：米），可设为 'auto' 自动计算或指定数值
    WIDTH: 0.265                          # 箱子宽度（26.5cm）
    LENGTH: 0.355                         # 箱子长度（35.5cm）
    HEIGHT: 0.15                          # 箱子高度（15cm）
    
    WALL_VISIBLE: true                    # 是否显示箱壁（false则隐藏仅用于碰撞）
    RANDOM_TEXTURE: false                 # 是否为箱子应用随机纹理
                                          # false=使用默认灰色，true=需要CC_TEXTURES_DIR有效
    
    KP: 0.6                               # 弹簧刚度系数（物理引擎参数）
                                          # 影响物体与箱壁的弹性碰撞效果

# ----------------------------------------------------------------------------
# 相机配置 (CAMERA)
# ----------------------------------------------------------------------------
CAMERA:
    # ------------------------------------------------------------------------
    # 相机内参配置 (INTRINSICS) - 模拟真实相机标定参数
    # ------------------------------------------------------------------------
    INTRINSICS:
        FX: 800.0                         # 焦距X方向（像素焦距 = 物理焦距 × (图像宽度像素数 / 传感器物理宽度)）
        FY: 800.0                         # 焦距Y方向（像素焦距 = 物理焦距 × (图像宽度像素数 / 传感器物理宽度)）

        
        PPX: 320                          # 主点X坐标（像素），WIDTH/2 = 640/2
        PPY: 320                          # 主点Y坐标（像素），HEIGHT/2 = 640/2
        
        WIDTH: 640                        # 图像宽度（像素）- 适合训练的中等分辨率
        HEIGHT: 640                       # 图像高度（像素）- 正方形图像便于处理
        
        # RANDOM_PERCENT: 5               # 内参随机扰动百分比（可选，暂未启用）
    
    # ------------------------------------------------------------------------
    # 相机位姿采样器配置 (POSE_SAMPLER)
    # ------------------------------------------------------------------------
    POSE_SAMPLER:
        # 相机距离箱子中心的球壳半径范围（米）
        MIN_HEIGHT: 0.6                   # 最小拍摄距离
                                          # 已优化：从1.2m降至0.6m（更近距离拍摄）
        MAX_HEIGHT: 0.75                  # 最大拍摄距离
                                          # 已优化：从1.8m降至0.75m
        
        # 相机俯仰角范围（度）
        MIN_ELEVATION: 60                 # 最小俯仰角（75度=斜上方）
        MAX_ELEVATION: 90                 # 最大俯仰角（90度=正上方俯视）
        
        # 相机方位角范围（度）- 水平旋转角度
        MIN_AZIMUTH: -15                  # 最小方位角（向左偏15度）
        MAX_AZIMUTH: 15                   # 最大方位角（向右偏15度）
                                          # 限制在±15度范围内，聚焦箱子中心区域

# ----------------------------------------------------------------------------
# 光照配置 (LIGHT)
# ----------------------------------------------------------------------------
LIGHT:
    MIN_NUM: 2                            # 最少光源数量
    MAX_NUM: 4                            # 最多光源数量（精简版，减少渲染时间）
    
    MIN_ENERGY: 8                         # 最小光源能量（亮度）
    MAX_ENERGY: 20                        # 最大光源能量（亮度）

    
    # 光源位置范围（相对于世界中心）
    MIN_HEIGHT: 1.2                       # 最低光源高度（米）
    MAX_HEIGHT: 1.5                       # 最高光源高度（米）
    
    # 光源俯仰角范围（度）
    MIN_ELEVATION: 45                     # 最小俯仰角（从斜上方照射）
    MAX_ELEVATION: 90                     # 最大俯仰角（从正上方照射）
